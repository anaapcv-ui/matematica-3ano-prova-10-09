<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo Verdadeiro ou Falso · Detetives das Formas · Matemática 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--teal:#0ea5a4;--teal2:#14c3c1;--coral:#ff6b4a;--purple:#7c5cff;--yellow:#ffd23f;--sun:#ff9f1c;--mint:#e8fbfa;--ink:#26263a;--dim:#6b6b8a;--pink:#ff8fab;--red:#ef5a6f;--blue:#3aa0ff}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#eafcfb,#f4fbff);font-family:'Nunito',system-ui,sans-serif;color:var(--ink);line-height:1.5;padding-bottom:70px}
  h1,h2,h3,.baloo{font-family:'Baloo 2','Nunito',sans-serif}
  header{background:linear-gradient(120deg,var(--teal),var(--purple));color:#fff;padding:18px 16px;border-bottom:6px solid var(--yellow);box-shadow:0 6px 0 #0b7f7e}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}
  .titlerow{display:flex;align-items:center;gap:14px}.owl{font-size:2.6rem}
  h1{margin:0;font-size:1.6rem;text-shadow:0 2px 0 rgba(0,0,0,.15)}.sub{font-size:.95rem;opacity:.95}
  .hud{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .bar{flex:1;min-width:140px;height:16px;background:#e6fbfa;border:3px solid #0b7f7e;border-radius:20px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--coral));transition:.4s}
  .pill{background:#fff;border-radius:20px;padding:4px 12px;font-weight:800;border:3px solid var(--yellow);color:var(--sun);white-space:nowrap}
  .card{background:#fff;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.08);border:3px solid #d8f3f2;padding:22px 20px;margin:20px 0;text-align:center}
  .qn{color:var(--dim);font-weight:800}
  .frase{font-family:'Baloo 2';font-size:1.4rem;margin:14px 0 18px;line-height:1.35}
  .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .vf{border:none;border-radius:16px;padding:16px 26px;font-family:'Baloo 2';font-size:1.3rem;cursor:pointer;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2)}
  .v{background:var(--teal)} .f{background:var(--red)}
  .vf:hover{transform:translateY(-2px)}
  .vf:disabled{opacity:.6;cursor:default;transform:none}
  .fb{display:none;margin-top:16px;padding:14px;border-radius:16px;font-size:1.05rem;font-weight:700}
  .fb.show{display:block;animation:pop .3s}
  @keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
  .fb.ok{background:#e2fbfa;color:#0b6b6a;border:3px solid var(--teal2)}
  .fb.no{background:#fff3f4;color:#a23;border:3px solid var(--red)}
  .next{margin-top:14px;background:var(--sun);color:#fff;border:none;border-radius:14px;padding:12px 22px;font-family:'Baloo 2';font-size:1.1rem;cursor:pointer;box-shadow:0 4px 0 #c67700;display:none}
  .next.show{display:inline-block}
  .final{display:none;text-align:center;background:linear-gradient(120deg,#fff3c4,#ffe08a);border:4px solid var(--sun);border-radius:24px;padding:26px 20px;margin:20px 0}
  .final.show{display:block;animation:pop .4s}
  .final .big{font-size:3.6rem}
  .final h2{color:var(--sun);margin:6px 0}
  .final .score{font-size:2.2rem;font-family:'Baloo 2';color:var(--teal)}
  .again{margin-top:12px;background:var(--teal);color:#fff;border:none;border-radius:16px;padding:14px 24px;font-family:'Baloo 2';font-size:1.2rem;cursor:pointer;box-shadow:0 5px 0 #0b7f7e}
  .savebar{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;border-top:3px solid var(--teal2);padding:8px 14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a.nav{background:var(--teal);color:#fff;border-radius:12px;padding:9px 16px;font-family:'Baloo 2';text-decoration:none;box-shadow:0 3px 0 #0b7f7e}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="titlerow"><div class="owl">🔍</div><div>
    <h1>Verdadeiro ou Falso — Detetives</h1>
    <div class="sub">Matemática · 3º ano · Unidade 7 · 12 desafios por rodada!</div>
  </div></div>
  <div class="hud">
    <div class="bar"><i id="pbar"></i></div>
    <div class="pill">⭐ <span id="stars">0</span></div>
    <div class="pill" style="border-color:var(--blue);color:var(--blue)"><span id="qnum">1</span>/12</div>
  </div>
</div></header>

<div class="wrap">
  <div class="card" id="card">
    <div class="qn">Desafio <span id="cn">1</span></div>
    <div class="frase" id="frase">...</div>
    <div class="btns">
      <button class="vf v" id="btnV" onclick="answer(true)">✔ Verdadeiro</button>
      <button class="vf f" id="btnF" onclick="answer(false)">✘ Falso</button>
    </div>
    <div class="fb" id="fb"></div>
    <button class="next" id="next" onclick="nextQ()">Próximo ▶</button>
  </div>

  <div class="final" id="final">
    <div class="big">🏆🔍</div>
    <h2>Fim de jogo!</h2>
    <div class="score"><span id="fscore">0</span> / 12 ⭐</div>
    <p id="fmsg"></p>
    <button class="again" onclick="start()">🔁 Jogar de novo</button>
  </div>
</div>

<div class="savebar">
  <a class="nav" href="resumo.html">🗒️ Resumo</a>
  <a class="nav" href="simulado.html">📝 Simulado</a>
  <a class="nav" href="index.html">⌂ Início</a>
</div>

<script>
const BANCO=[
 ['Em um poliedro, as faces são polígonos.',true,'Isso mesmo! Faces são polígonos, arestas são segmentos de reta e vértices são pontos.'],
 ['A aresta é o encontro de duas faces.',true,'Exatamente, é a "quina" do sólido.'],
 ['O vértice é o ponto de encontro entre as arestas.',true,'Perfeito! É o "bico" do sólido.'],
 ['As arestas de um poliedro são pontos.',false,'As arestas são segmentos de reta. Os pontos são os vértices.'],
 ['O bloco retangular tem 6 faces com formato de retângulo.',true,'E também 12 arestas e 8 vértices.'],
 ['O bloco retangular tem 8 arestas.',false,'Ele tem 12 arestas e 8 vértices.'],
 ['Um bloco retangular com todas as arestas da mesma medida é um cubo.',true,'É exatamente a definição do livro.'],
 ['Todas as faces do cubo são triangulares.',false,'Todas as faces do cubo são quadradas.'],
 ['O cubo tem 6 faces, 12 arestas e 8 vértices.',true,'Decorou! É o quadro do detetive.'],
 ['O cubo e o bloco retangular também são prismas.',true,'Isso mesmo — muda só o formato da base.'],
 ['No prisma, as faces laterais têm formato de retângulo.',true,'As bases é que mudam de formato.'],
 ['O telhado da casa de palafita se parece com um prisma.',true,'E as paredes com o piso formam um bloco retangular.'],
 ['As casas de palafita são construídas sobre troncos para evitar inundações.',true,'Nas cheias do rio, a casa fica acima da água.'],
 ['Na pirâmide, as faces laterais são triângulos.',true,'E elas se encontram todas num vértice no topo.'],
 ['Toda pirâmide tem base quadrada.',false,'A base pode ser triângulo, quadrado, pentágono e outros polígonos.'],
 ['O cilindro não tem vértices nem arestas.',true,'Suas duas bases têm formato de círculo.'],
 ['As bases do cilindro têm formato de quadrado.',false,'As bases do cilindro são círculos.'],
 ['O cone tem 1 vértice.',true,'É o biquinho no topo, e a base é um círculo.'],
 ['A esfera tem vértices, arestas e base.',false,'A esfera não tem nada disso — é totalmente redonda.'],
 ['Cilindro, cone e esfera são figuras espaciais arredondadas.',true,'Elas têm parte curva e rolam.'],
 ['O cesto de vime indígena se parece com um bloco retangular.',true,'Está no livro, na parte do artesanato indígena.'],
 ['A planificação é o molde do sólido aberto no plano.',true,'É o molde antes de montar a figura.'],
 ['Na malha quadriculada, a letra indica a linha e o número indica a coluna.',true,'Como a casa da Camila em D3.'],
 ['Na batalha-naval, o navio ocupa 2 espaços e o submarino ocupa 3.',false,'É o contrário: o navio ocupa 3 e o submarino ocupa 2.'],
 ['Na batalha-naval, as embarcações podem encostar umas nas outras.',false,'Não podem se encostar, nem por um lado nem por um vértice.'],
 ['No xadrez, a posição das peças usa uma letra minúscula e um número.',true,'Como o rei preto na posição e8.'],
 ['As comunidades quilombolas são formadas por descendentes de africanos escravizados.',true,'É o que conta a página dos trajetos.'],
 ['A planta baixa é o desenho de um lugar visto de cima.',true,'Como a planta da academia de capoeira.']
];
let rodada=[],idx=0,score=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(){
  rodada=shuffle([...BANCO]).slice(0,12);idx=0;score=0;
  document.getElementById('final').classList.remove('show');
  document.getElementById('card').style.display='block';
  document.getElementById('stars').textContent=0;
  render();
}
function render(){
  const it=rodada[idx];
  document.getElementById('cn').textContent=idx+1;
  document.getElementById('qnum').textContent=idx+1;
  document.getElementById('frase').textContent='“'+it[0]+'”';
  document.getElementById('fb').className='fb';document.getElementById('fb').innerHTML='';
  document.getElementById('next').classList.remove('show');
  document.getElementById('btnV').disabled=false;document.getElementById('btnF').disabled=false;
  document.getElementById('pbar').style.width=(idx/12*100)+'%';
}
function answer(v){
  const it=rodada[idx];const fb=document.getElementById('fb');
  document.getElementById('btnV').disabled=true;document.getElementById('btnF').disabled=true;
  const acertou=(v===it[1]);
  if(acertou){score++;document.getElementById('stars').textContent=score;
    fb.className='fb ok show';fb.innerHTML='🎉 Certíssimo! '+it[2];}
  else{fb.className='fb no show';fb.innerHTML='🙂 Quase! A frase é <b>'+(it[1]?'VERDADEIRA':'FALSA')+'</b>. '+it[2];}
  document.getElementById('next').classList.add('show');
  document.getElementById('pbar').style.width=((idx+1)/12*100)+'%';
}
function nextQ(){
  idx++;
  if(idx>=12){showFinal();}else{render();}
}
function showFinal(){
  document.getElementById('card').style.display='none';
  const f=document.getElementById('final');f.classList.add('show');
  document.getElementById('fscore').textContent=score;
  const pct=Math.round(score/12*100);
  let m;
  if(score>=11)m='🌟 UAU! Você é um verdadeiro Detetive das Formas! ('+pct+'% de acertos)';
  else if(score>=8)m='😃 Muito bem! Você mandou super bem! ('+pct+'%)';
  else if(score>=5)m='🙂 Bom trabalho! Dá uma revisada no Resumo e jogue de novo. ('+pct+'%)';
  else m='💪 Vamos treinar mais! Volte na Leitura Guiada e tente outra vez. ('+pct+'%)';
  document.getElementById('fmsg').textContent=m;
}
start();
</script>
</body>
</html>
